<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Harmonogram zajęć</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

<header>
    <h1>Harmonogram zajęć</h1>
</header>

<main>
    <section id="lewa">
        <fieldset>
            <legend>Wybór dnia</legend>
            <label>Data</label>
            <input type="date" id="data">
            <button onclick="ustawDate()">Ustaw dzień</button>
        </fieldset>

        <fieldset>
            <legend>Dodaj zajęcia</legend>

            <label>Rodzaj zajęć</label>
            <select id="rodzaj">
                <option value="">-- wybierz --</option>
                <option value="mat">Matematyka</option>
                <option value="inf">Informatyka</option>
                <option value="wf">WF</option>
                <option value="jez">Język obcy</option>
                <option value="inne">Inne</option>
            </select>

            <label>Godzina</label>
            <input type="text" id="godzina">

            <label>Przedmiot</label>
            <input type="text" id="przedmiot">

            <button onclick="dodajZajecia()">Dodaj zajęcia</button>
        </fieldset>

        <div class="buttons">
            <button onclick="zapiszHarmonogram()">Zapisz harmonogram</button>
            <button onclick="drukujHarmonogram()">Drukuj harmonogram</button>
        </div>
    </section>

    <section id="prawa">
        <section id="kiedy"></section>
        <section id="plan"></section>
    </section>
</main>

</body>
</html>
