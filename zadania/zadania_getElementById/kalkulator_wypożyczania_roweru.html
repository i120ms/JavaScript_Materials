<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Wypożyczania Roweru</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f4faff;
      margin: 0;
      padding: 0;
      color: #333;
    }

    h1 {
      background-color: #3498db;
      color: white;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    form {
      max-width: 420px;
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    fieldset {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    legend {
      font-weight: bold;
      color: #2980b9;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 5px;
    }

    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #3498db;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    .result {
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    #suma {
      color: #3498db;
    }
  </style>
</head>
<body>

  <h1>Kalkulator wypożyczania roweru 🚲</h1>

  <form>
    <fieldset>
      <legend>1. Wybierz rodzaj roweru</legend>
      <select id="rodzaj">
        <option value="miejski">Miejski – 10 zł/h</option>
        <option value="gorski">Górski – 15 zł/h</option>
        <option value="elektryczny">Elektryczny – 25 zł/h</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>2. Czas wypożyczenia</legend>
      <select id="czas">
        <option value="1">1 godzina</option>
        <option value="3">3 godziny (10% taniej)</option>
        <option value="6">6 godzin (20% taniej)</option>
        <option value="24">Cały dzień (30% taniej)</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>3. Opcje dodatkowe</legend>
      <label><input type="radio" name="dodatek" value="brak" checked> Bez kasku</label>
      <label><input type="radio" name="dodatek" value="kask"> Z kaskiem (+5 zł)</label>
      <label><input type="radio" name="dodatek" value="pelny"> Kask + kamizelka (+8 zł)</label>
    </fieldset>

    <fieldset>
      <legend>4. Ilość rowerów</legend>
      <input type="number" id="ilosc" min="1" value="1">
    </fieldset>

    <fieldset>
      <legend>5. Oblicz koszt</legend>
      <button type="button" onclick="oblicz()">Oblicz</button>
      <div class="result">Do zapłaty: <span id="suma">0.00 zł</span></div>
    </fieldset>
  </form>

  <script>
    function oblicz(){
        let rodzaj = document.getElementById("rodzaj").value;
        let czas = document.getElementById("czas").value;
        let dodatek = document.querySelector('input[name="dodatek"]:checked').value;
        let ilosc = Number(document.getElementById("ilosc").value);

        let cenyRodzaj = {
            "miejski" : 10, "gorski" : 15, "elektryczny" : 25
        };
        let cenaRodzaj = cenyRodzaj[rodzaj];

        let cenyDodatki ={
            "brak" : 0, "kask" : 5, "pelny" : 8
        };
        let cenaDodatki = cenyDodatki[dodatek];
        let cena = cenaRodzaj + cenaDodatki;

        let cenyWyp = {
            "1" : 0, "3" : 0.1, "6" : 0.2, "24" : 0.3
        };
        let cenaWyp = cenyWyp[czas];
        cena = cena * (1 - cenaWyp);

        let suma = cena * ilosc;
        document.getElementById("suma").textContent = suma.toFixed(2) + " zł";
    }
  </script>

</body>
</html>
