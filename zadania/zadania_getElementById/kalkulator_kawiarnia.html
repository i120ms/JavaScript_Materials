<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Kawiarni</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f3ef;
      color: #333;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 20px;
      background-color: #c89f74;
      color: white;
      margin-bottom: 20px;
    }

    form {
      max-width: 400px;
      background: white;
      padding: 20px;
      margin: 0 auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    fieldset {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    legend {
      font-weight: bold;
      color: #6b4f36;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #c89f74;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #b6895d;
    }

    .result {
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    #suma {
      color: #6b4f36;
    }
  </style>
</head>
<body>

  <h1>Kalkulator Kawiarni ☕</h1>

  <form>
    <fieldset>
      <legend>1. Wybierz rodzaj kawy</legend>
      <select id="kawa">
        <option value="espresso">Espresso – 6 zł</option>
        <option value="latte">Latte – 8 zł</option>
        <option value="cappuccino">Cappuccino – 9 zł</option>
        <option value="mocha">Mocha – 10 zł</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>2. Wybierz rozmiar</legend>
      <label><input type="radio" name="rozmiar" value="mala" checked> Mała</label>
      <label><input type="radio" name="rozmiar" value="duza"> Duża (+2 zł)</label>
    </fieldset>

    <fieldset>
      <legend>3. Dodatki</legend>
      <select id="dodatek">
        <option value="brak">Brak</option>
        <option value="syrop">Syrop waniliowy (+1 zł)</option>
        <option value="mleko">Mleko roślinne (+2 zł)</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>4. Ilość</legend>
      <input type="number" id="ilosc" min="1" value="1">
    </fieldset>

    <fieldset>
      <legend>5. Oblicz koszt</legend>
      <button type="button" onclick="oblicz()">Oblicz</button>
      <div class="result">Do zapłaty: <span id="suma">0.00 zł</span></div>
    </fieldset>
  </form>

  <script>
    function oblicz(){
        let rodzaj = document.getElementById("kawa").value;
        let rozmiar = document.querySelector('input[name="rozmiar"]:checked').value;
        let dodatki = document.getElementById("dodatek").value
        let ilosc = Number(document.getElementById("ilosc").value);

    // 1. rodzaj kawy
        let cenyRodzajow = {
            "espresso" : 6, "latte" : 8, "cappuccino" : 9, "mocha" : 10
        };
        let cenaRodzaju = cenyRodzajow[rodzaj];

    // 3. dodatki
        let cenyDodatkow = {
            "brak" : 0, "syrop" : 1, "mleko" : 2
        };
        let cenaDodatkow = cenyDodatkow[dodatki];

        let cena = cenaRodzaju + cenaDodatkow;

    // 2. rozmiar
        if(rozmiar == "duza"){
            cena = cena + 2;
        }

        let suma = cena * ilosc;
        document.getElementById("suma").textContent = suma.toFixed(2) + " zł";
    }
  </script>

</body>
</html>
