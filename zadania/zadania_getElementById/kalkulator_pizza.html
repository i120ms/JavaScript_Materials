<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Pizzy</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #fff8f2;
      color: #333;
      margin: 0;
      padding: 0;
    }

    h1 {
      background-color: #e74c3c;
      color: white;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    form {
      max-width: 420px;
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    fieldset {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    legend {
      font-weight: bold;
      color: #c0392b;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 5px;
    }

    button {
      display: block;
      width: 100%;
      padding: 10px;
      background-color: #e74c3c;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #c0392b;
    }

    .result {
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    #suma {
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <h1>Kalkulator Pizzy 🍕</h1>

  <form>
    <fieldset>
      <legend>1. Rozmiar pizzy</legend>
      <label><input type="radio" name="rozmiar" value="mala" checked> Mała – 18 zł</label>
      <label><input type="radio" name="rozmiar" value="srednia"> Średnia – 24 zł</label>
      <label><input type="radio" name="rozmiar" value="duza"> Duża – 30 zł</label>
    </fieldset>

    <fieldset>
      <legend>2. Rodzaj ciasta</legend>
      <select id="ciasto">
        <option value="cienkie">Cienkie (0 zł)</option>
        <option value="grube">Grube (+2 zł)</option>
        <option value="serowe">Serowe ranty (+4 zł)</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>3. Dodatki</legend>
      <select id="dodatek">
        <option value="brak">Brak</option>
        <option value="pieczarki">Pieczarki (+2 zł)</option>
        <option value="szynka">Szynka (+3 zł)</option>
        <option value="pepperoni">Pepperoni (+4 zł)</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>4. Ilość</legend>
      <input type="number" id="ilosc" min="1" value="1">
    </fieldset>

    <fieldset>
      <legend>5. Oblicz cenę</legend>
      <button type="button" onclick="oblicz()">Oblicz</button>
      <div class="result">Do zapłaty: <span id="suma">0.00 zł</span></div>
    </fieldset>
  </form>

  <script>
    function oblicz(){
        let rozmiar = document.querySelector('input[name="rozmiar"]:checked').value;
        let rodzaj = document.getElementById("ciasto").value;
        let dodatki = document.getElementById("dodatek").value;
        let ilosc = Number(document.getElementById("ilosc").value);

    // 2. ceny rodzaj
        let cenyRodzaj = {
            "cienkie" : 0, "grube" : 2, "serowe" : 4
        };
        let cenaRodzaj = cenyRodzaj[rodzaj];
    
    // 3. ceny dodatki
        let cenyDodatki = {
            "brak" : 0, "pieczarki" : 2, "szynka" : 3, "pepperoni" : 4
        };
        let cenaDodatki = cenyDodatki[dodatki];
        let cena = cenaRodzaj + cenaDodatki;

    // 1. rozmiar
        if(rozmiar == "srednia"){
            cena = cena + 6;
        } else if(rozmiar == "duza"){
            cena = cena + 12;
        }

        let suma = cena * ilosc;
        document.getElementById("suma").textContent = suma.toFixed(2) + " zł";
    }
  </script>

</body>
</html>
